<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Music - Streaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-bg">
            <div class="auth-orb auth-orb-1"></div>
            <div class="auth-orb auth-orb-2"></div>
            <div class="auth-orb auth-orb-3"></div>
            <div class="auth-grid"></div>
        </div>
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon"><i class="fas fa-bolt"></i></div>
                <span class="auth-logo-text">GEMINI MUSIC</span>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab auth-tab-active" id="tab-login">Connexion</button>
                <button class="auth-tab" id="tab-signup">Inscription</button>
            </div>
            <div class="auth-form">
                <div class="auth-field">
                    <label class="auth-label">Email</label>
                    <div class="auth-input-wrap">
                        <i class="fas fa-envelope auth-field-icon"></i>
                        <input type="email" id="auth-email" class="auth-input" placeholder="nom@exemple.com">
                    </div>
                </div>
                <div class="auth-field">
                    <label class="auth-label">Mot de passe</label>
                    <div class="auth-input-wrap">
                        <i class="fas fa-lock auth-field-icon"></i>
                        <input type="password" id="auth-password" class="auth-input" placeholder="••••••••">
                    </div>
                </div>
                <div id="auth-error" class="auth-error"></div>
                <button id="auth-btn" class="auth-submit-btn">Continuer</button>
            </div>
        </div>
    </div>

    <div class="app" id="main-app">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo"><i class="fas fa-bolt" style="color:var(--green)"></i> <span>Gemini</span></div>
                <nav class="sidebar-nav">
                    <button class="nav-item active" onclick="showSection('home')"><i class="fas fa-house"></i> <span>Accueil</span></button>
                    <button class="nav-item" onclick="showSection('search')"><i class="fas fa-magnifying-glass"></i> <span>Rechercher</span></button>
                </nav>
            </div>
            <div class="sidebar-library">
                <div class="library-header">
                    <button class="nav-item library-btn"><i class="fas fa-book"></i> <span>Bibliothèque</span></button>
                    <button onclick="createPlaylist()" class="btn-circle-sm"><i class="fas fa-plus"></i></button>
                </div>
                <div id="library-content"></div> 
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-wrap">
                    <i class="fas fa-search search-icon-inp"></i>
                    <input type="text" id="search-input" placeholder="Que souhaitez-vous écouter ?">
                    <button id="search-btn" onclick="searchMusic()">Rechercher</button>
                </div>

                <div class="topbar-right">
                    <button class="user-btn" style="background:none; border:none;" onclick="toggleUserMenu()">
                        <div id="user-avatar" class="user-avatar">?</div>
                    </button>
                    <div id="user-menu" class="user-dropdown">
                        <div id="user-email-display" class="user-dropdown-info"></div>
                        <button onclick="logout()" class="user-dropdown-item"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
                    </div>
                </div>
            </header>

            <section id="music-section" class="section-content">
                <div id="music-grid" class="music-grid">
                    <div class="results-placeholder">
                        <div class="placeholder-icon"><i class="fas fa-music"></i></div>
                        <h2>Recherchez vos titres favoris</h2>
                        <p>Trouvez de la musique parmi des millions de titres YouTube.</p>
                    </div>
                </div>
            </section>

            <section id="playlist-view" class="section-content" style="display:none;"></section>
        </main>

        <aside class="queue-panel" id="queue-panel">
            <div class="queue-header">File d'attente</div>
            <div id="queue-list" class="queue-list"></div>
        </aside>

        <footer class="player-bar">
            <div class="player-left">
                <div class="player-thumb">
                    <img id="current-track-img" src="" alt="">
                </div>
                <div class="player-track-info">
                    <span id="current-track-title" class="player-track-title">Aucun titre</span>
                    <span id="current-track-artist" class="player-track-artist">-</span>
                </div>
            </div>
            <div class="player-center">
                <div class="controls-row">
                    <button class="ctrl-icon"><i class="fas fa-shuffle"></i></button>
                    <button class="ctrl-icon" onclick="prevTrack()"><i class="fas fa-backward-step"></i></button>
                    <button class="btn-play-circle" onclick="togglePlay()"><i id="play-icon" class="fas fa-play"></i></button>
                    <button class="ctrl-icon" onclick="nextTrack()"><i class="fas fa-forward-step"></i></button>
                    <button class="ctrl-icon"><i class="fas fa-repeat"></i></button>
                </div>
                <div class="progress-row">
                    <span id="time-current">0:00</span>
                    <div class="slider-container">
                        <input type="range" id="progress-bar" value="0" min="0" max="100">
                    </div>
                    <span id="time-total">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <button class="ctrl-icon"><i class="fas fa-list"></i></button>
                <input type="range" id="volume-control" value="50" min="0" max="100" style="width: 80px; margin-left: 10px;">
            </div>
        </footer>
    </div>

    <div id="youtube-player" style="display: none;"></div>
    
    <div id="playlist-modal" class="playlist-popup" style="display:none;">
        <div class="popup-header">
            <span>Ajouter à...</span>
            <button onclick="closePlaylistModal()">&times;</button>
        </div>
        <div id="playlist-options" class="popup-body"></div>
    </div>

    <div id="toast">Titre ajouté à la playlist</div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
