<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Spotube Premium</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2 class="logo">Spotube</h2>
            <nav>
                <div class="nav-item" onclick="showSection('search-section')">🏠 Recherche</div>
                <hr class="separator">
                <div class="nav-item action" onclick="createNewPlaylist()">➕ Créer une playlist</div>
                <div id="playlists-nav-list" class="playlists-list"></div>
            </nav>
        </aside>

        <main class="main-content">
            <section id="search-section">
                <header class="search-bar">
                    <input type="text" id="search-input" placeholder="Artiste, titre...">
                    <button id="search-btn">Rechercher</button>
                </header>
                <div id="results" class="music-grid"></div>
            </section>

            <section id="playlist-section" style="display:none;">
                <div class="playlist-header">
                    <div>
                        <h1 id="active-playlist-name">Ma Playlist</h1>
                        <p id="playlist-count">0 titres</p>
                    </div>
                    <button onclick="deleteCurrentPlaylist()" class="btn-danger">Supprimer</button>
                </div>
                <div id="playlist-list" class="track-list-view"></div>
            </section>
        </main>

        <footer class="player-bar">
            <div class="player-left">
                <b id="current-track-title">Aucun titre</b><br>
                <small id="current-track-artist">Artiste</small>
            </div>
            
            <div class="player-center">
                <button class="control-btn" id="btn-play" onclick="togglePlay()">▶</button>
                <div class="progress-area">
                    <span id="time-current">0:00</span>
                    <input type="range" id="progress-bar" value="0" max="100">
                    <span id="time-total">0:00</span>
                </div>
                <div id="player"></div> </div>

            <div class="player-right">
                <span>🔊</span>
                <input type="range" id="volume-bar" value="100" max="100">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
