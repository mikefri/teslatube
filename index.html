<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotube Clone</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2 class="logo">Spotube</h2>
            <nav>
                <ul>
                    <li class="nav-item" onclick="showSection('search-section')">🏠 Recherche</li>
                    <hr class="separator">
                    <li class="nav-item action" onclick="createNewPlaylist()">➕ Créer une playlist</li>
                </ul>
                <div id="playlists-nav-list" class="playlists-list">
                    </div>
            </nav>
        </aside>

        <main class="main-content">
            <section id="search-section">
                <header>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Que voulez-vous écouter ?">
                        <button id="search-btn">Rechercher</button>
                    </div>
                </header>
                <div id="results" class="music-grid"></div>
            </section>

            <section id="playlist-section" style="display:none;">
                <div class="playlist-header">
                    <div class="playlist-info">
                        <h1 id="active-playlist-name">Ma Playlist</h1>
                        <p id="playlist-count">0 titres</p>
                    </div>
                    <button onclick="deleteCurrentPlaylist()" class="btn-danger">Supprimer la playlist</button>
                </div>
                <div id="playlist-list" class="track-list-view"></div>
            </section>
        </main>

        <footer class="player-bar">
            <div class="player-left">
                <div class="current-info">
                    <span id="current-track-title">Aucun titre</span>
                    <span id="current-track-artist">Artiste</span>
                </div>
            </div>
            
            <div class="player-center">
                <div class="player-controls">
                    <button class="control-btn" onclick="togglePlay()" id="btn-play">▶</button>
                </div>
                <div class="progress-area">
                    <span id="time-current">0:00</span>
                    <input type="range" id="progress-bar" value="0" max="100">
                    <span id="time-total">0:00</span>
                </div>
                <div id="player"></div> </div>

            <div class="player-right">
                <span class="vol-icon">🔊</span>
                <input type="range" id="volume-bar" value="100" max="100">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
